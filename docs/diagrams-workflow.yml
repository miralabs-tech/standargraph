name: Diagrams

on:
  push:
    branches: [main]
    paths: ["**/*.sg"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: miralabs-tech/standargraph@v1
        with:
          files: "docs/**/*.sg"
          formats: svg
          theme: light
      - name: Commit the rendered diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs
          if git diff --cached --quiet; then
            echo "Diagrams are up to date"
          else
            git commit -m "Update rendered diagrams"
            git push
          fi
